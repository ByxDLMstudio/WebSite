<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ducky Frontend</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            background: #0b0b0e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .full-image { 
            max-width: 100%; 
            max-height: 90vh;
            width: auto; 
            height: auto; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); 
            border: 1px solid #23232f; 
        }
    </style>
</head>
<body>

    <img src="image.png" alt="Загрузка изображения..." class="full-image">

</body>
</html>
