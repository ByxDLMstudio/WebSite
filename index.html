<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck-Host Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #e1e1e6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1a1a1e; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #29292e; }
        .status { padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .status.online { background: #04d361; color: #000; }
        .status.offline { background: #ff79c6; color: #000; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; margin-right: 10px; transition: 0.2s; }
        .btn-start { background: #04d361; color: #000; }
        .btn-start:hover { background: #02a94d; }
        .btn-stop { background: #ff5555; color: #fff; }
        .btn-stop:hover { background: #cc4444; }
        .console-box { background: #000; border-radius: 8px; padding: 15px; height: 400px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #00ff00; border: 1px solid #29292e; white-space: pre-wrap; margin-bottom: 15px; }
        .input-group { display: flex; }
        .cmd-input { flex-grow: 1; padding: 12px; background: #1a1a1e; border: 1px solid #29292e; border-radius: 5px 0 0 5px; color: #fff; font-size: 14px; }
        .cmd-input:focus { outline: none; border-color: #04d361; }
        .btn-send { background: #6272a4; color: #fff; border-radius: 0 5px 5px 0; margin-right: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Duck-Host Управление</h2>
        <div id="status-badge" class="status {% if status == 'Запущен' %}online{% else %}offline{% endif %}">{{ status }}</div>
    </div>

    <div style="margin-bottom: 20px;">
        <button class="btn btn-start" onclick="controlServer('start')">Запустить</button>
        <button class="btn btn-stop" onclick="controlServer('stop')">Остановить</button>
    </div>

    <div class="console-box" id="console">{{ history }}</div>

    <div class="input-group">
        <input type="text" id="cmd" class="cmd-input" placeholder="Введите команду сервера (например: op игрок)..." onkeydown="if(event.key === 'Enter') sendCommand()">
        <button class="btn btn-send" onclick="sendCommand()">Отправить</button>
    </div>
</div>

<script>
    const consoleBox = document.getElementById('console');
    consoleBox.scrollTop = consoleBox.scrollHeight;

    // Подключаем WebSocket для живой консоли
    const ws = new WebSocket(`ws://${window.location.host}/console`);

    ws.onmessage = function(event) {
        consoleBox.textContent += event.data;
        consoleBox.scrollTop = consoleBox.scrollHeight; // Автопрокрутка вниз
        
        // Меняем статус на "Запущен", если видим логи загрузки
        if (event.data.includes("Starting minecraft server")) {
            document.getElementById('status-badge').className = "status online";
            document.getElementById('status-badge').textContent = "Запущен";
        }
    };

    async function controlServer(action) {
        let response = await fetch(`/${action}`, { method: 'POST' });
        let result = await response.json();
        if (action === 'stop' && result.status === 'success') {
            document.getElementById('status-badge').className = "status offline";
            document.getElementById('status-badge').textContent = "Выключен";
        }
    }

    function sendCommand() {
        const input = document.getElementById('cmd');
        if (input.value.trim() !== "") {
            ws.send(input.value);
            input.value = "";
        }
    }
</script>
</body>
</html>
